<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Helpify</title>
  <!-- La marque du site (components/logo-mark.tsx), en noir et blanc, agrandie
       de 18 % autour de son centre : dans un onglet de 16 px, un logo qui ne
       remplit pas son carré perd le peu de place dont il dispose. Noire sur une
       barre claire, blanche sur une barre sombre. -->
  <style>
    path { stroke: #121214; }
    @media (prefers-color-scheme: dark) { path { stroke: #f4f1ea; } }
  </style>
  <g transform="translate(32,32) scale(1.18) translate(-32,-32)">
    <path d="M27 10C14 19 14 45 27 54" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M41 19C50 25 50 39 41 45" stroke-width="7.5" stroke-linecap="round" stroke-opacity="0.45"/>
  </g>
</svg>
